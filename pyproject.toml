[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certdiag"
dynamic = ["version"]
description = "Windows 代码签名与证书链诊断：把系统报错翻译成可操作的根因"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ihadimh"}]
keywords = ["windows", "authenticode", "code-signing", "diagnostics"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/ihadimh/certdiag"
Issues = "https://github.com/ihadimh/certdiag/issues"

[tool.setuptools]
packages = ["certdiag"]

[tool.setuptools.dynamic]
version = {attr = "certdiag.__version__"}
