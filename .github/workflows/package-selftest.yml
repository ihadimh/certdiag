name: package-selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: pip install .
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: 控制台入口
        shell: pwsh
        run: |
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          & "$scripts\certdiag.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "certdiag --version 失败" }

      - name: 库入口
        shell: pwsh
        run: |
          python -c "import certdiag; from certdiag import attribute; print('version', certdiag.__version__); print('api', callable(attribute))"

      - name: 构建 wheel
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps -w wheelhouse
          $whl = Get-ChildItem wheelhouse\*.whl
          if (-not $whl) { throw "没有生成 wheel" }
          Write-Host "wheel: $($whl.Name)"
