name: sign-release

# 手动触发：给已发布的 release 资产做 Sigstore 无密钥签名。
# 不在 release 事件上自动跑，避免签名服务波动影响发布。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要签名的 release tag（例如 v2.4.0）
        required: true
        default: v2.4.0

permissions:
  contents: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 release 资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern "certdiag-portable.zip" \
            --pattern "SHA256SUMS.txt"

      - name: Sigstore 签名
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            dist/certdiag-portable.zip
            dist/SHA256SUMS.txt

      - name: 上传签名与证书
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" dist/*.sig dist/*.crt --clobber
          gh release upload "${{ inputs.tag }}" dist/*.sigstore.json --clobber || true
